name: Build and publish Android release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build Android APK
        run: flutter build apk --release
      - name: Prepare Android release asset
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/YomiPalette-${VERSION}-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release/*-Android.apk

  publish:
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$VERSION" release-assets/* \
            --repo "$REPOSITORY" \
            --title "YomiPalette Android $VERSION" \
            --notes "Android test APK (debug signing). Production distribution requires release signing." \
            --generate-notes
